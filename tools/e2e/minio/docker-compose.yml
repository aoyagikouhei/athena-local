# issue #39 Step 9（実機検証）の足場。
# tools/e2e/trino-probe/docker-compose.yml をベースに、athena-local が
# 結果ファイルを書く先として MinIO を足したもの。本物の AWS は一切使わない。
#
# ポートは trino-probe（Trino のみ 8090）や他プロジェクトの compose と衝突しないものを選んだ
# （2026-09-21 時点の `docker ps` で確認）。
name: athena-local-issue39-e2e

services:
  trino:
    image: trinodb/trino:482
    container_name: athena-local-issue39-e2e-trino
    ports:
      - "8092:8080"
    volumes:
      - ./catalog:/etc/trino/catalog:ro
      - trino-hive-data:/data/hive
      - trino-iceberg-data:/data/iceberg

  minio:
    image: quay.io/minio/minio:latest
    container_name: athena-local-issue39-e2e-minio
    ports:
      - "9002:9000" # S3 互換 API
      - "9003:9001" # 管理コンソール（無くても検証は進む）
    environment:
      # ローカル専用のダミー認証情報。本物の AWS の認証情報ではない。
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # issue #46: Athena JDBC ドライバの S3 クライアントは virtual-hosted style
      # （<bucket>.<endpoint host> = athena-results.tls-proxy）でアクセスする。
      # これが無いと MinIO はホスト名からバケット名を切り出せず NoSuchBucket になる
      # （README.md「Athena JDBC 3.x needs a TLS terminator in front」の注記どおり。2026-09-21 実測）。
      # path style のアクセス（verify.sh や mc）はこの設定があっても従来どおり通る。
      MINIO_DOMAIN: tls-proxy
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 使い捨てコンテナ。起動のたびに athena-results バケットを（無ければ）作って終了する。
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: athena-local-issue39-e2e-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/athena-results
        echo "bucket ready: athena-results"

  # issue #39 実機検証（JDBC 版）: Athena JDBC 3.x は平文 HTTP のエンドポイントを拒否する
  # （README.md の「Athena JDBC 3.x needs a TLS terminator in front」参照）ため、
  # athena-local（ホスト上のプロセス、127.0.0.1:8087）と MinIO の手前で TLS を終端する。
  tls-proxy:
    image: nginx:1.27.0
    container_name: athena-local-issue39-e2e-tls-proxy
    extra_hosts:
      # athena-local は compose のサービスではなくホスト上のプロセスなので host-gateway で届かせる。
      - "host.docker.internal:host-gateway"
    ports:
      - "8443:8443" # -> host.docker.internal:8087 (athena-local)
      - "9443:9443" # -> minio:9000
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ./tls/server.key:/etc/nginx/tls/server.key:ro
    networks:
      default:
        # ドライバの S3 クライアントが virtual-hosted style
        # （<bucket>.<endpoint host>）でアクセスする場合に備えたエイリアス。
        aliases:
          - athena-results.tls-proxy

  # issue #39 実機検証（JDBC 版）: 公式 Athena JDBC ドライバを使い捨てコンテナで動かすためのビルド環境。
  # `docker compose run --rm jdbc-client ...` で使う（常駐サービスではない）。
  jdbc-client:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /work
    volumes:
      - ./jdbc-client:/work
      - jdbc-client-m2:/root/.m2
      - ./tls:/tls:ro
    # cacerts に自己署名証明書を取り込んでから接続する必要があるため、
    # 実行は verify.sh 側で `docker compose run` の command で毎回指定する。
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep infinity"]

volumes:
  trino-hive-data:
  trino-iceberg-data:
  minio-data:
  jdbc-client-m2:
