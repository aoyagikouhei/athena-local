events {}

http {
  # 結果ファイルは大きくなり得るし SigV4 は Host ヘッダを署名するので、
  # クライアントが署名した Host をそのまま通し、ボディはバッファしない。
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    location / {
      # athena-local は docker compose のサービスではなくホスト上のプロセス
      # （verify.sh と同じ構成）。host-gateway 経由でホストの 127.0.0.1:8087 に転送する。
      proxy_pass http://host.docker.internal:8087;
      proxy_read_timeout 300s;
    }
  }

  server {
    listen 9443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    location / {
      proxy_pass http://minio:9000;
      proxy_read_timeout 300s;
    }
  }
}
