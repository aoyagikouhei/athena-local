connector.name=hive
hive.metastore=file
# ファイルシステムの有効化行が無い版は file:// を Hadoop の FS で書く。/data は root の持ち物で trino が書けないので /tmp（#308）。
hive.metastore.catalog.dir=file:///tmp/hive
hive.non-managed-table-writes-enabled=true
# 古い版（440・400）の既定のアクセス制御は DROP TABLE と ADD COLUMN を PERMISSION_DENIED で拒む。C 節の updateType を測るため許す（#308）。
hive.security=allow-all
