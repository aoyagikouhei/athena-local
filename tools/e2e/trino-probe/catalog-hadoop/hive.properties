connector.name=hive
hive.metastore=file
# ローカル FS の設定名が無く、Hadoop の FS が既定で無効な版（470）向け。file:// を Hadoop の FS で書く（#308）。
hive.metastore.catalog.dir=file:///tmp/hive
hive.non-managed-table-writes-enabled=true
fs.hadoop.enabled=true
# catalog-nofsflag と同じ理由（470 の既定では要らないが、この catalog を使う別の版のために揃える）。
hive.security=allow-all
