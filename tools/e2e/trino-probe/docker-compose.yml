# issue #39 で作成（tools/ へ移す前の名前は 39-trino-probe/docker-compose.yml）
services:
  trino:
    # バージョン差の確認用に ${TRINO_TAG:-482} で差し替えられるようにしてある
    # （issue #39 の人間検証リスト 1 番目）。
    image: trinodb/trino:${TRINO_TAG:-482}
    container_name: athena-local-issue39-trino
    ports:
      - "8090:8080"
    volumes:
      # 古いバージョンは fs.local.enabled が無く fs.native-local.enabled が要るため、
      # ${CATALOG_DIR:-./catalog} で差し替えられるようにしてある（./catalog-legacy を用意）。
      - ${CATALOG_DIR:-./catalog}:/etc/trino/catalog:ro
      - hive-data:/data/hive
      - iceberg-data:/data/iceberg

volumes:
  hive-data:
  iceberg-data:
