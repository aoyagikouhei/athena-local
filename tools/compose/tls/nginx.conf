events {}

http {
  # 結果ファイルは大きくなり得るし SigV4 は Host ヘッダを署名するので、
  # クライアントが署名した Host をそのまま通し、ボディはバッファしない。
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;

  server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    location / {
      # athena-local は dev（toolbox）の中のプロセス。tools/dev.sh が dev に別名を付け、
      # 足場は tls-proxy を dev より後に作り直すので、起動時の名前解決で届く。
      proxy_pass http://dev:8087;
      proxy_read_timeout 300s;
    }
  }

  server {
    listen 9443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    location / {
      proxy_pass http://minio:9000;
      proxy_read_timeout 300s;
    }
  }
}
