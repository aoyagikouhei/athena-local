name: docker

# タグ(v*)を打つと Docker Hub に amd64 / arm64 のイメージを publish する。
# QEMU エミュレーションは遅いので、アーキごとにネイティブランナーでビルドして
# digest だけを push し、最後にマニフェストへまとめる。
# arm64 ランナー(ubuntu-24.04-arm)は public リポジトリなら無料で使える。
# 事前に DOCKERHUB_USERNAME と DOCKERHUB_TOKEN をリポジトリの secrets に登録しておくこと。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: aoyagikouhei/athena-local

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ラベル(OCI アノテーション)だけ使う。タグは merge ジョブ側で付ける。
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: digest を受け渡し用に書き出す
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${PLATFORM//\//-}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: 各アーキの digest をマニフェストにまとめる
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(for digest in *; do printf '%s@%s ' "$IMAGE" "$(cat "$digest")"; done)

      - name: publish されたマニフェストを確認する
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
