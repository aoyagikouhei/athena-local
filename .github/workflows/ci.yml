name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # その push で変わったファイルが docs/・.claude/・tools/measure/・*.md だけなら、check と e2e を飛ばす（#286）。
  # paths-ignore は pull_request では PR 全体の差分で判定するので、コードを含む PR にノートだけのコミットを足したときに
  # 効かない。PR の更新は前の head から、PR を開いたときは base との分岐点から、main への push は前のコミットから比べる。
  # 手動の起動と、差分が取れないとき（force push で前の head が無いなど）は走らせる。
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT/$ACTION" in
            pull_request/synchronize) from=$BEFORE to=$HEAD ;;
            pull_request/*) from=$(git merge-base "$BASE" "$HEAD" 2>/dev/null) to=$HEAD ;;
            push/*) from=$BEFORE to=$AFTER ;;
            *) from= to= ;;
          esac
          tools/ci/code-changed.sh "$from" "$to" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Trino も AWS も使わない（テスト内で Trino の偽物を立てる）。
      - run: cargo test --locked

  # 検証の足場（tools/e2e）のうち軽いものを toolbox（compose.yml の dev サービス）の中で流す（#130）。
  # request-errors は Trino も MinIO も要らない。paging-validation・quoted-names・context-catalog・sdk-retry は Trino だけ。
  # それより下の 7 本は Trino と MinIO（minio-init）を使う。どの足場も開始時に自分で compose の down -v → up -d をする。
  # 手元の所要（2026-09-27、イメージはキャッシュ済み。#265）は 1 本 13〜42 秒、足した 8 本で約 3 分。
  # 入れない足場（#265）:
  #   retention       既定で負荷 240 秒 × 2（約 10 分）
  #   python-clients  setup-venvs.sh で PyPI から取る venv が要る（足場そのものは 90 秒）
  #   jdbc-drivers    ドライバの jar を外から取る（全 7 版）
  #   trino-probe     旧版の Trino を版ごとに pull して起動を測る
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # Docker Hub の匿名 pull の制限（ランナーは IP を共有する）に当たらないよう、docker.yml と同じ secrets でログインする。
      # secrets が無い（フォークからの PR）ときはログインを省く。
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tools/dev.sh と同じ計算でタグを決める（Dockerfile の sha256 の先頭 12 桁）。ずれても compose が build に落ちるだけ。
      - id: toolbox
        run: echo "tag=$(sha256sum tools/toolbox/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # toolbox のイメージを GHA キャッシュからビルドして手元に置く（docker.yml と同じ type=gha）。
      # 手元にタグがあれば、tools/dev.sh の docker compose run はビルドしない（compose.yml の pull_policy: never）。
      - uses: docker/build-push-action@v7
        with:
          context: tools/toolbox
          load: true
          tags: athena-local-toolbox:${{ steps.toolbox.outputs.tag }}
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,scope=toolbox

      # toolbox の中の cargo のレジストリと release の成果物（CARGO_HOME / CARGO_TARGET_DIR はリポジトリの .toolbox の下）。
      # 足場が使うのは cargo build --release だけなので target は release に絞る（debug まで入れると数 GB になる）。
      - uses: actions/cache@v6
        with:
          path: |
            .toolbox/cargo/registry
            .toolbox/target/release
          key: toolbox-cargo-${{ steps.toolbox.outputs.tag }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            toolbox-cargo-${{ steps.toolbox.outputs.tag }}-

      - run: tools/dev.sh tools/e2e/request-errors/verify.sh
      # 1 本目のビルド（.toolbox/target/release/athena-local）をそのまま使う。
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/paging-validation/verify.sh
      # 引用符付きの名前と DESCRIBE・SHOW COLUMNS の存在の確認（#207）。
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/quoted-names/verify.sh
      # 実在しない QueryExecutionContext の Catalog をメタデータの文だけ既定に差し替える（#214）。
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/context-catalog/verify.sh
      # boto3 のリトライと同じ ClientRequestToken の再送（#94）。
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/sdk-retry/verify.sh
      # ここから MinIO も使う。CI の外にあったあいだに期待値が古くなって誰も気づかなかった（#254）ので、最近の挙動を固定する足場から並べる。
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/create-table-catalog/verify.sh
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/ctas-catalog/verify.sh
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/s3-tables-location/verify.sh
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/block-comment/verify.sh
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/utility-rows/verify.sh
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/result-content-type/verify.sh
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/minio/verify.sh
      # toolbox の中の cargo test を amd64 でも通す（開発機は arm64 なので、ここが amd64 の唯一の確認。#184）。
      # check ジョブの cargo test はホストのランナーで直に動くので、toolbox のイメージ・uid・マウントの上では通らない。
      - run: tools/dev.sh cargo test --locked
