name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # その push で変わったファイルが docs/・.claude/・tools/measure/・*.md だけなら、check と e2e を飛ばす（#286）。
  # paths-ignore は pull_request では PR 全体の差分で判定するので、コードを含む PR にノートだけのコミットを足したときに
  # 効かない。PR の更新は前の head から、PR を開いたときは base との分岐点から、main への push は前のコミットから比べる。
  # 手動の起動と、差分が取れないとき（force push で前の head が無いなど）は走らせる。
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT/$ACTION" in
            pull_request/synchronize) from=$BEFORE to=$HEAD ;;
            pull_request/*) from=$(git merge-base "$BASE" "$HEAD" 2>/dev/null) to=$HEAD ;;
            push/*) from=$BEFORE to=$AFTER ;;
            *) from= to= ;;
          esac
          tools/ci/code-changed.sh "$from" "$to" | tee -a "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Trino も AWS も使わない（テスト内で Trino の偽物を立てる）。
      - run: cargo test --locked

  # 検証の足場（tools/e2e）のうち軽いものを toolbox（compose.yml の dev サービス）の中で流す（#130）。
  # request-errors は Trino も MinIO も要らない。paging-validation・quoted-names・context-catalog・sdk-retry は Trino だけ。
  # 残りの 7 本は Trino と MinIO（minio-init）を使う。どの足場も開始時に自分で compose の down -v → up -d をするので、
  # 組に Trino だけの足場と MinIO も使う足場が混ざってよい。
  # 直列の 1 ジョブでは 389 秒かかっていた（2026-09-27、run 36294840869）ので、足場を 3 組と toolbox の cargo test に分けて
  # 並列に流す（#288）。組は足場の所要（上の run の実測、秒）の合計が均等になるように割る。
  # 入れない足場（#265）:
  #   retention       既定で負荷 240 秒 × 2（約 10 分）
  #   python-clients  setup-venvs.sh で PyPI から取る venv が要る（足場そのものは 90 秒）
  #   jdbc-drivers    ドライバの jar を外から取る（全 7 版）
  #   trino-probe     旧版の Trino を版ごとに pull して起動を測る
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      # 1 組が落ちても残りの組を最後まで流し、落ちた足場をまとめて見る。
      fail-fast: false
      matrix:
        include:
          # 26（リリースビルド込み）+ 36 + 15 + 14 = 91 秒。cargo のキャッシュはこの組だけが保存する（下の save）。
          - group: a
            scripts: request-errors block-comment context-catalog sdk-retry
            save-cache: true
          # 32 + 24 + 19 + 15 = 90 秒
          - group: b
            scripts: paging-validation utility-rows s3-tables-location quoted-names
          # 18 + 20 + 22 + 22 + 37 = 119 秒（describe-extended は手元の実測。#275）
          - group: c
            scripts: create-table-catalog ctas-catalog result-content-type minio describe-extended
          # toolbox の中の cargo test を amd64 でも通す（開発機は arm64 なので、ここが amd64 の唯一の確認。#184）。
          # check ジョブの cargo test はホストのランナーで直に動くので、toolbox のイメージ・uid・マウントの上では通らない。
          - group: cargo-test
    name: e2e (${{ matrix.group }})
    env:
      # Docker Hub の匿名 pull の制限（ランナーは IP を共有する）に当たらないよう、docker.yml と同じ secrets でログインする。
      # secrets が無い（フォークからの PR）ときはログインを省く。
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tools/dev.sh と同じ計算でタグを決める（Dockerfile の sha256 の先頭 12 桁）。ずれても compose が build に落ちるだけ。
      - id: toolbox
        run: echo "tag=$(sha256sum tools/toolbox/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # toolbox のイメージを GHA キャッシュからビルドして手元に置く（docker.yml と同じ type=gha）。
      # 手元にタグがあれば、tools/dev.sh の docker compose run はビルドしない（compose.yml の pull_policy: never）。
      - uses: docker/build-push-action@v7
        with:
          context: tools/toolbox
          load: true
          tags: athena-local-toolbox:${{ steps.toolbox.outputs.tag }}
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,scope=toolbox

      # toolbox の中の cargo のレジストリと release の成果物（CARGO_HOME / CARGO_TARGET_DIR はリポジトリの .toolbox の下）。
      # 足場が使うのは cargo build --release だけなので target は release に絞る（debug まで入れると数 GB になる）。
      # 同じ key に 4 つのジョブが保存しようとしないよう、取り出しと保存を分け、保存は save-cache の組だけにする。
      - id: cargo-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .toolbox/cargo/registry
            .toolbox/target/release
          key: toolbox-cargo-${{ steps.toolbox.outputs.tag }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            toolbox-cargo-${{ steps.toolbox.outputs.tag }}-

      # 組の 1 本目がリリースビルドをし、残りはその .toolbox/target/release/athena-local をそのまま使う（SKIP_BUILD=1）。
      # 1 本が落ちたらその組はそこで止まる（run の既定のシェルは bash -e）。
      - if: matrix.scripts
        env:
          SCRIPTS: ${{ matrix.scripts }}
        run: |
          skip=0
          for s in $SCRIPTS; do
            echo "::group::$s"
            tools/dev.sh SKIP_BUILD=$skip "tools/e2e/$s/verify.sh"
            echo "::endgroup::"
            skip=1
          done

      - if: matrix.group == 'cargo-test'
        run: tools/dev.sh cargo test --locked

      # 旧い actions/cache と同じく、key がそのまま当たらなかったときだけ、成功した後に保存する。
      - if: matrix.save-cache && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .toolbox/cargo/registry
            .toolbox/target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
