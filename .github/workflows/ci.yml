name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      # Trino も AWS も使わない（テスト内で Trino の偽物を立てる）。
      - run: cargo test --locked

  # 検証の足場（tools/e2e）のうち軽いものを toolbox（compose.yml の dev サービス）の中で流す（#130）。
  # request-errors は Trino も MinIO も要らない。paging-validation と quoted-names は Trino だけ。
  e2e:
    runs-on: ubuntu-24.04
    env:
      # Docker Hub の匿名 pull の制限（ランナーは IP を共有する）に当たらないよう、docker.yml と同じ secrets でログインする。
      # secrets が無い（フォークからの PR）ときはログインを省く。
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # tools/dev.sh と同じ計算でタグを決める（Dockerfile の sha256 の先頭 12 桁）。ずれても compose が build に落ちるだけ。
      - id: toolbox
        run: echo "tag=$(sha256sum tools/toolbox/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # toolbox のイメージを GHA キャッシュからビルドして手元に置く（docker.yml と同じ type=gha）。
      # 手元にタグがあれば、tools/dev.sh の docker compose run はビルドしない（compose.yml の pull_policy: never）。
      - uses: docker/build-push-action@v7
        with:
          context: tools/toolbox
          load: true
          tags: athena-local-toolbox:${{ steps.toolbox.outputs.tag }}
          cache-from: type=gha,scope=toolbox
          cache-to: type=gha,scope=toolbox

      # toolbox の中の cargo のレジストリと release の成果物（CARGO_HOME / CARGO_TARGET_DIR はリポジトリの .toolbox の下）。
      # 足場が使うのは cargo build --release だけなので target は release に絞る（debug まで入れると数 GB になる）。
      - uses: actions/cache@v6
        with:
          path: |
            .toolbox/cargo/registry
            .toolbox/target/release
          key: toolbox-cargo-${{ steps.toolbox.outputs.tag }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            toolbox-cargo-${{ steps.toolbox.outputs.tag }}-

      - run: tools/dev.sh tools/e2e/request-errors/verify.sh
      # 1 本目のビルド（.toolbox/target/release/athena-local）をそのまま使う。
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/paging-validation/verify.sh
      # 引用符付きの名前と DESCRIBE・SHOW COLUMNS の存在の確認（#207）。
      - run: tools/dev.sh SKIP_BUILD=1 tools/e2e/quoted-names/verify.sh
      # toolbox の中の cargo test を amd64 でも通す（開発機は arm64 なので、ここが amd64 の唯一の確認。#184）。
      # check ジョブの cargo test はホストのランナーで直に動くので、toolbox のイメージ・uid・マウントの上では通らない。
      - run: tools/dev.sh cargo test --locked
